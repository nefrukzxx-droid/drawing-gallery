<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунт — Drawing Gallery</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <main class="auth-island">
        <a href="index.html" class="back-link">← На главную</a>

        <h1>Твой аккаунт</h1>
        <p class="subtitle">Присоединяйся к галерее рисунков</p>

        <div class="tabs">
            <button id="loginTab" class="active">Войти</button>
            <button id="registerTab">Регистрация</button>
        </div>

        <form id="authForm">
            <label for="email">Электронная почта</label>
            <input id="email" type="email" placeholder="example@mail.com" required>

            <label for="password">Пароль</label>
            <input id="password" type="password" placeholder="Минимум 6 символов" required minlength="6">

            <button type="submit" id="submitButton">Войти</button>
        </form>

        <p id="message"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
